name: AgroAlerta CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Run Flutter tests when a test suite exists
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'No Flutter test suite is present; analyzer and platform builds remain mandatory.'
          fi
      - name: Generate missing Flutter web scaffold
        run: |
          if [ ! -d web ]; then
            flutter create . --platforms web
          fi
      - run: flutter build web --release
      - run: flutter build apk --debug
