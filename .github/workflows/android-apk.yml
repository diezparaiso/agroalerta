name: AgroAlerta Android APK

on:
  push:
    branches:
      - feature/agroalerta-real-data-layer
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=agroalerta_andalucia .

      - name: Configure Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          marker = "compileOptions {"
          if marker not in text:
              raise SystemExit("No se encontró compileOptions en el proyecto Android generado")
          text = text.replace(marker, marker + "\n        isCoreLibraryDesugaringEnabled = true", 1)
          text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          path.write_text(text)
          PY

      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agroalerta-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
