org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Nota (2026-10-01): la plantilla de Flutter 3.47 trae -Xmx8G -XX:MaxMetaspaceSize=4G, pero esta
# máquina tiene ~8 GB de RAM y el daemon JVM crasheaba con "insufficient memory" (hs_err_pid*.log).
# Se redujo para que assembleDebug quepa en memoria; subirlo solo si se dispone de más RAM.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
