name: agroalerta_andalucia
description: Avisos fitosanitarios responsive para agricultores de Andalucia.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.5
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  google_mobile_ads: ^5.3.1
  flutter_local_notifications: ^18.0.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  connectivity_plus: ^6.1.1
  image_picker: ^1.1.2
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.1.5
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
